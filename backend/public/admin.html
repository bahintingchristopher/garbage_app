<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GarbageApp Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="login" class="card">
  <h3>Admin login</h3>
  <label>Email</label><input id="email" type="email" value="admin@garbageapp.com">
  <label>Password</label><input id="password" type="password">
  <p><button class="btn green" style="width:100%" data-action="login">Sign in</button></p>
  <div id="loginErr" class="muted" style="color:#c62828"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>GarbageApp Admin Dashboard</h1>
    <button class="btn grey" data-action="logout">Logout</button>
  </header>
  <nav>
    <button data-tab="topups" class="active">Top-ups</button>
        <button data-tab="announcements">Announcements</button>
    <button data-tab="support">Support</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="materials">Materials</button>
    <button data-tab="collectors">Collectors</button>
    <button data-tab="clients">Clients</button>
    <button data-tab="pending">Pending</button>
    <button data-tab="features">Gcash</button>
    <button data-tab="settings">System Fee</button>
  </nav>
  <main>
    <div id="tab-topups"></div>
        <div id="tab-announcements"></div>
    <div id="tab-support"></div>
    <div id="tab-stats"></div>
    <div id="tab-materials"></div>
    <div id="tab-collectors"></div>
    <div id="tab-clients"></div>
    <div id="tab-pending"></div>
    <div id="tab-features"></div>
    <div id="tab-settings"></div>
  </main>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
